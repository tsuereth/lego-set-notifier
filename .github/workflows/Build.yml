name: Build

on:
  workflow_dispatch:
  # Only run this workflow on main pushes when code relevant to the release has changed.
  # Changes to test code, documentation, et al will not automatically trigger a release.
  push:
    branches:
      - main
    paths:
      - 'LegoSetNotifier/**'

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: SetupDotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: TestLegoSetNotifier
        run: |
          dotnet test LegoSetNotifier.Test/LegoSetNotifier.Test.csproj

      - name: SetReleaseVersion
        id: set_release_version
        run: |
          echo "version=$(date +%Y%m%d).$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: PublishLegoSetNotifier
        run: |
          dotnet publish \
              LegoSetNotifier/LegoSetNotifier.csproj \
              --runtime linux-x64 \
              --configuration Release \
              --property:Version=0.0.0-${{ steps.set_release_version.outputs.version }} \
              --property:PublishSingleFile=true \
              --self-contained true \
              --output publish_output

      - name: ReleaseArtifacts
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_release_version.outputs.version }}
          files: |
            publish_output/*
